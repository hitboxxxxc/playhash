# PlayHash — runner econômico (autoridade econômica admin).
# Plano Spark: SEM Cloud Functions / Storage / Blaze. Executa via GitHub Actions.
#
# IMPORTANTE: para minutos gratuitos ILIMITADOS em repos privados não serem
# consumidos, este workflow deve viver em um REPOSITÓRIO PÚBLICO separado
# (sugestão: repo contendo apenas backend/ + .github/workflows/econ-cron.yml).
#
# Secret necessário: FIREBASE_SERVICE_ACCOUNT_KEY = conteúdo JSON completo
# da service account (nunca ecoado no log).
#
# PAYOUTS (saques):
#   - Repo variable PAYOUT_MODE: "test" (padrão; simulação auditada SIM-*)
#     ou "live" (FaucetPay real). Definir com:
#       gh variable set PAYOUT_MODE --body test
#   - MODO LIVE (AÇÃO HUMANA futura — NÃO executar agora):
#       1. gh secret set FAUCETPAY_API_KEY   # chave da conta FaucetPay
#       2. gh variable set PAYOUT_MODE --body live
#     A chave NUNCA vai para o APK/Git — só existe como secret do runner.

name: econ-cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'run = economic runner | seed = dev seed | devTopUp = crédito de dev (ENV=dev) | rulesProbe = verificação das rules (ENV=dev) | payoutProbe = leitura FaucetPay + grava providerMinLitoshi (ENV=dev) | payoutLiveTest = micro-payout REAL por endereço (PAYOUT_MODE=live + inputs) | livePayoutDirect = micro-payout REAL por E-MAIL do dono (PAYOUT_MODE=live; PROVA 1 do provedor)'
        type: choice
        options:
          - run
          - seed
          - devTopUp
          - rulesProbe
          - payoutProbe
          - payoutLiveTest
          - livePayoutDirect
          - devDiag
        default: run
        required: true
      uid:
        description: 'devTopUp: uid do usuário que receberá o crédito (exigido p/ devTopUp)'
        type: string
        required: false
        default: ''
      amountCoins:
        description: 'devTopUp: quantidade em coins (padrão 5000)'
        type: string
        required: false
        default: '5000'
      payoutAsset:
        description: 'payoutLiveTest: ativo (BTC/LTC/DOGE/USDT) — exigido só p/ payoutLiveTest'
        type: string
        required: false
        default: ''
      payoutAddress:
        description: 'payoutLiveTest: endereço DO DONO que receberá o micro-payout (nunca logado)'
        type: string
        required: false
        default: ''
      payoutAmount:
        description: 'payoutLiveTest: valor decimal no ativo (vazio = providerMin da config/payouts v2)'
        type: string
        required: false
        default: ''
      payoutEmail:
        description: 'livePayoutDirect: e-mail FaucetPay DO DONO que receberá o micro-payout (nunca logado)'
        type: string
        required: false
        default: ''
      devRelaxCooldown:
        description: 'devDiag: "1" = zera cooldownHours em config/payouts (TEMPORÁRIO p/ teste E2E)'
        type: string
        required: false
        default: ''
      devResetWi:
        description: 'devDiag: "1" = zera contadores wi_<hoje> em rateLimits (destrava cota das rules)'
        type: string
        required: false
        default: ''

concurrency:
  group: econ-runner
  cancel-in-progress: false

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Write service account key to temp file
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT_KEY is missing" >&2
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/serviceAccount.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Ensure Firestore indexes (idempotente)
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'run'
        working-directory: backend
        env:
          GOOGLE_CLOUD_PROJECT: playhash-70742
        run: node dist/ensureIndexes.js

      - name: Seed Firestore (dev)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'seed'
        working-directory: backend
        run: node dist/seed.js

      # rulesProbe: verifica se as Security Rules estão publicadas criando uma
      # withdrawalIntent COMO CLIENTE (custom token ⇒ ID token ⇒ Firestore
      # REST). GATE: ENV=dev. Limpa a intent de teste ao final.
      - name: Rules probe (client-like intent create, ENV=dev only)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rulesProbe'
        working-directory: backend
        env:
          RUNNER_ACTION: rulesProbe
          APP_ENV: ${{ vars.ENV }}
        run: node dist/runner.js

      # payoutProbe: valida a chave FaucetPay (balance/fees), lê saldo/taxa e
      # GRAVA providerMinLitoshi em config/payouts v4 (merge seguro; nunca
      # abaixo do já confirmado). GATE no runner: repo variable ENV=dev.
      # NUNCA envia payout; nunca imprime a chave (só status/saldos mascarados).
      - name: Payout probe (read-only + write providerMin, ENV=dev only)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'payoutProbe'
        working-directory: backend
        env:
          RUNNER_ACTION: payoutProbe
          APP_ENV: ${{ vars.ENV }}
          FAUCETPAY_API_KEY: ${{ secrets.FAUCETPAY_API_KEY }}
        run: node dist/runner.js

      # devDiag (12.11): diagnóstico rateLimits/intents + relaxes opcionais de
      # dev (cooldown=0, reset cota wi). GATE: ENV=dev.
      - name: Dev diag (ENV=dev only)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'devDiag'
        working-directory: backend
        env:
          RUNNER_ACTION: devDiag
          APP_ENV: ${{ vars.ENV }}
          DEV_RELAX_COOLDOWN: ${{ inputs.devRelaxCooldown }}
          DEV_RESET_WI: ${{ inputs.devResetWi }}
        run: node dist/runner.js

      # payoutLiveTest: MICRO-PAYOUT REAL (OPCIONAL; default NÃO executa).
      # GATE duplo no runner: exige repo variable PAYOUT_MODE=live E inputs
      # explícitos (asset + endereço do dono + amount). Não reserva saldo de
      # usuário; auditoria WITHDRAWAL_TEST; falha não derruba o job.
      - name: Payout live micro-test (PAYOUT_MODE=live only)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'payoutLiveTest'
        working-directory: backend
        env:
          RUNNER_ACTION: payoutLiveTest
          PAYOUT_MODE: ${{ vars.PAYOUT_MODE }}
          FAUCETPAY_API_KEY: ${{ secrets.FAUCETPAY_API_KEY }}
          PAYOUT_TEST_ASSET: ${{ inputs.payoutAsset }}
          PAYOUT_TEST_ADDRESS: ${{ inputs.payoutAddress }}
          PAYOUT_TEST_AMOUNT: ${{ inputs.payoutAmount }}
        run: node dist/runner.js

      # livePayoutDirect (12.13): MICRO-PAYOUT REAL POR E-MAIL (PROVA 1).
      # GATE duplo no runner: exige repo variable PAYOUT_MODE=live E input
      # `payoutEmail` válido. Envia UM pagamento = mínimo do provedor para o
      # e-mail do DONO (transferência interna); grava providerMinLitoshi+taxa
      # em config/payouts v4. Falha ⇒ código seguro, sem crash.
      - name: Payout live direct (email, PAYOUT_MODE=live only)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'livePayoutDirect'
        working-directory: backend
        env:
          RUNNER_ACTION: livePayoutDirect
          PAYOUT_MODE: ${{ vars.PAYOUT_MODE }}
          FAUCETPAY_API_KEY: ${{ secrets.FAUCETPAY_API_KEY }}
          PAYOUT_DIRECT_ASSET: 'LTC'
          PAYOUT_DIRECT_EMAIL: ${{ inputs.payoutEmail }}
        run: node dist/runner.js

      # devTopUp: crédito de saldo de desenvolvimento. GATE no runner:
      # só executa de verdade quando a repo variable ENV == "dev"
      # (gh variable set ENV --body dev). Caso contrário é no-op logado.
      - name: Dev top-up (ENV=dev only)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'devTopUp'
        working-directory: backend
        env:
          RUNNER_ACTION: devTopUp
          APP_ENV: ${{ vars.ENV }}
          DEV_TOPUP_UID: ${{ inputs.uid }}
          DEV_TOPUP_COINS: ${{ inputs.amountCoins }}
        run: node dist/runner.js

      - name: Run economic runner
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'run'
        working-directory: backend
        env:
          # Modo de payout dos saques: repo variable PAYOUT_MODE ("test"|"live").
          # Ausente/inválida ⇒ runner usa "test" (simulação auditada).
          PAYOUT_MODE: ${{ vars.PAYOUT_MODE }}
          # Opcional: exigido SOMENTE quando PAYOUT_MODE=live (FaucetPay real).
          FAUCETPAY_API_KEY: ${{ secrets.FAUCETPAY_API_KEY }}
        run: node dist/runner.js

      - name: Cleanup key file
        if: always()
        run: rm -f "$RUNNER_TEMP/serviceAccount.json"
